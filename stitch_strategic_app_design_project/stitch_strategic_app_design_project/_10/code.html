<script>
        // Micro-interactions for form feedback
        document.querySelectorAll('input, select, textarea').forEach(element => {
            element.addEventListener('focus', () => {
                element.closest('.form-focus-ring')?.classList.add('border-secondary');
            });
            element.addEventListener('blur', () => {
                element.closest('.form-focus-ring')?.classList.remove('border-secondary');
            });
        });

        // Submit logic mock
        document.querySelector('form').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> 처리 중...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> 신청 완료`;
                btn.classList.replace('bg-primary', 'bg-success-green');
                alert('가입 신청이 성공적으로 접수되었습니다.');
                window.history.back();
            }, 1500);
        });
    </script>
